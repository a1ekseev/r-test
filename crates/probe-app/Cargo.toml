[package]
name = "probe-app"
description = "Tauri shell of the probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Embedded WebDriver server for E2E on platforms without a native webview driver. Debug builds only.
e2e = ["dep:tauri-plugin-wdio-webdriver"]
# Serve the bundled frontend when building without the Tauri CLI.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
probe-core = { workspace = true }
tauri = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }
serde = { workspace = true }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
serde_json = { workspace = true }
