[workspace]
resolver = "3"
members = ["crates/probe-core", "crates/probe-server", "crates/probe-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
probe-core = { path = "crates/probe-core" }
probe-server = { path = "crates/probe-server" }

tokio = { version = "1.53.2", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
  "connect",
  "handshake",
  "rustls-tls-native-roots",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
time = "0.3.55"
uuid = { version = "1.28.0", features = ["v4"] }
base64 = "0.23.1"
hex = "0.4.3"
sha2 = "0.11.1"
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
x25519-dalek = { version = "3.0.0", features = ["zeroize"] }
crypto_box = "0.9.1"
crypto_secretbox = "0.1.1"
blake2 = "0.11.0"
getrandom = "0.4.3"
keyring = "4.2.0"
gethostname = "1.1.0"
os_info = { version = "3.15.0", default-features = false }
iana-time-zone = "0.1.65"
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "json",
  "query",
  "tokio",
  "ws",
  "macros",
] }
clap = { version = "4.6.7", features = ["derive"] }
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-build = "2.7.2"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-wdio-webdriver = "1.5.0"
# test-only
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
